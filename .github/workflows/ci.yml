name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -A clippy::too_many_arguments -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Native binding contract
        working-directory: crates/ai-hist-napi
        run: |
          npm ci
          npm run build:debug
          git diff --exit-code -- index.d.ts

      - name: TypeScript tests
        working-directory: sdk-ts
        run: |
          npm ci
          npm run lint
          npm test

      - name: Installed SDK and CLI smoke test
        working-directory: sdk-ts
        run: |
          npm pack --json >/tmp/ai-hist-pack.json
          node dist/cli.js sessions list --db /tmp/relayhistory-missing.db --json

  node-22-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            crates/ai-hist-napi/package-lock.json
            sdk-ts/package-lock.json
      - name: Build native addon
        working-directory: crates/ai-hist-napi
        run: npm ci && npm run build:debug
      - name: Test SDK on Node 22
        working-directory: sdk-ts
        run: npm ci && npm test

  windows-state-replacement:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify repeated private-state replacement
        run: cargo test -p ai-hist-engine write_private_replaces_existing_state
