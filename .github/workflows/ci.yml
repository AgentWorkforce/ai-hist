name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -A clippy::too_many_arguments -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build Rust CLI for wrapper tests
        run: cargo build -q -p ai-hist-cli

      - name: Python tests
        run: |
          python -m pip install pytest
          AI_HIST_RUST_BIN="$PWD/target/debug/ai-hist" python -m pytest -q test_ai_hist.py test_cli_dispatch.py test_install.py

      - name: TypeScript tests
        working-directory: sdk-ts
        run: |
          npm ci
          npm run lint
          npm test

      - name: Native binding contract
        working-directory: crates/ai-hist-napi
        run: |
          npm ci
          npm run build:debug
          git diff --exit-code -- index.d.ts

      - name: End-to-end wrapper verification
        run: AI_HIST_RUST_BIN="$PWD/target/debug/ai-hist" ./scripts/verify-e2e.sh

  windows-state-replacement:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify repeated private-state replacement
        run: cargo test -p ai-hist-cli write_private_replaces_existing_state
